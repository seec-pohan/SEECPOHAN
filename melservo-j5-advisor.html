<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MELSERVO-J5 選型與技術問答顧問 (離線單頁版)</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-muted: #F1F5F9;
      --ink: #0F172A;
      --ink-secondary: #475569;
      --border: #E2E8F0;
      --accent: #E60012;
      --accent-hover: #C80010;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
    }
    .nav-desktop {
      display: none;
      gap: 4px;
    }
    @media (min-width: 768px) {
      .nav-desktop { display: flex; }
      .nav-mobile { display: none !important; }
    }
    .nav-btn {
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 0;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .nav-btn.active {
      background: var(--ink);
      color: #FFFFFF;
    }
    .nav-btn:hover:not(.active) { background: var(--surface-muted); color: var(--ink); }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 16px 88px;
    }
    @media (min-width: 768px) { main { padding: 28px 24px 48px; } }
    .page-head {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .page-head h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .page-head p { margin: 6px 0 0; font-size: 13px; color: var(--ink-secondary); }
    .grid-wizard {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (min-width: 1024px) {
      .grid-wizard { grid-template-columns: 7fr 5fr; }
      .sticky-aside { position: sticky; top: 76px; }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .step-tag { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent); }
    .card-title { margin: 2px 0 0; font-size: 16px; font-weight: 700; }
    .card-head {
      border-bottom: 1px solid #F1F5F9;
      padding-bottom: 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .opt-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) { .opt-grid.cols-2 { grid-template-columns: 1fr 1fr; } .opt-grid.cols-3 { grid-template-columns: repeat(3, 1fr); } }
    .opt-btn {
      min-height: 52px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .opt-btn:hover { border-color: #CBD5E1; background: #F8FAFC; }
    .opt-btn.active {
      border-color: var(--accent);
      background: rgba(230, 0, 18, 0.04);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .opt-btn .t { font-size: 14px; font-weight: 600; color: var(--ink); }
    .opt-btn.active .t { color: var(--accent); }
    .opt-btn .s { font-size: 12px; color: var(--ink-secondary); margin-top: 3px; }
    .kw-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .kw-btn {
      min-height: 40px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .kw-btn.active { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
    input[type="number"], input[type="text"], select {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      font-size: 14px;
      background: #F8FAFC;
      color: var(--ink);
    }
    input:focus { outline: 2px solid rgba(230, 0, 18, 0.25); border-color: var(--accent); background: #FFFFFF; }
    .metrics-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #F8FAFC;
      margin: 12px 0;
    }
    .metrics-row > div { padding: 10px 12px; }
    .metrics-row > div:first-child { border-right: 1px solid var(--border); }
    .bom-list { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .bom-item { padding: 12px 14px; border-bottom: 1px solid var(--border); background: #FFFFFF; }
    .bom-item:last-child { border-bottom: 0; }
    .warn-box {
      border: 1px solid #FDE68A;
      background: #FFFBEB;
      color: #78350F;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .warn-box.error { border-color: #FCA5A5; background: #FEF2F2; color: #7F1D1D; }
    .btn-primary {
      min-height: 46px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 0;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-outline {
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: #FFFFFF; }
    table { width: 100%; min-width: 720px; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #F8FAFC; padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--ink-secondary); font-weight: 600; }
    td { padding: 11px 14px; border-bottom: 1px solid #F1F5F9; vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    .nav-mobile {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      height: 56px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }
    .nav-mobile button {
      border: 0;
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
      min-height: 44px;
    }
    .nav-mobile button.active { color: var(--accent); }
    .hidden { display: none !important; }
    .label-sm { font-size: 12px; font-weight: 600; color: var(--ink-secondary); margin: 12px 0 8px; display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <svg width="22" height="20" viewBox="0 0 24 22" fill="none" aria-hidden="true">
          <polygon points="12,1 16,8 12,15 8,8" fill="#E60012" />
          <polygon points="12,15 4,15 0,21 8,21" fill="#E60012" />
          <polygon points="12,15 20,15 24,21 16,21" fill="#E60012" />
        </svg>
        <span>MELSERVO-J5 選型顧問</span>
      </div>
      <nav class="nav-desktop">
        <button class="nav-btn active" data-tab="wizard" onclick="switchTab('wizard')">選型精靈</button>
        <button class="nav-btn" data-tab="faq" onclick="switchTab('faq')">技術問答速查</button>
        <button class="nav-btn" data-tab="specs" onclick="switchTab('specs')">規格總覽</button>
        <button class="nav-btn" data-tab="decoder" onclick="switchTab('decoder')">型號解析</button>
      </nav>
      <div class="mono" style="font-size:12px;color:#64748B;">單頁離線版 · L(NA)03180CHN-K</div>
    </div>
  </header>

  <main>
    <div class="page-head">
      <h1 id="page-title">SV J5 互動式選型精靈</h1>
      <p>速度頻寬 3.5 kHz · 最速通信週期 31.25 μs · 26-bit 無電池絕對型編碼器</p>
    </div>

    <!-- TAB 1: WIZARD -->
    <section id="tab-wizard" class="grid-wizard">
      <div id="wizard-steps"></div>
      <aside class="sticky-aside">
        <div class="card" id="bom-panel"></div>
      </aside>
    </section>

    <!-- TAB 2: FAQ -->
    <section id="tab-faq" class="hidden">
      <div class="card">
        <label class="label-sm" for="faq-search" style="margin-top:0;">搜尋技術問題關鍵字（例如：CN2L、31.25、MR-J5W3、DBU、SEMI F47、J4）</label>
        <input id="faq-search" type="text" style="width:100%;" placeholder="輸入關鍵字篩選原廠技術解答..." oninput="renderFaq()" />
      </div>
      <div id="faq-list"></div>
    </section>

    <!-- TAB 3: SPECS -->
    <section id="tab-specs" class="hidden">
      <div class="card">
        <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;">
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <button class="kw-btn active" data-spec="amplifiers" onclick="switchSpec('amplifiers')">伺服放大器</button>
            <button class="kw-btn" data-spec="controllers" onclick="switchSpec('controllers')">運動控制器</button>
            <button class="kw-btn" data-spec="rotary" onclick="switchSpec('rotary')">旋轉馬達 HK</button>
            <button class="kw-btn" data-spec="linear" onclick="switchSpec('linear')">線性 LM / 直驅 TM</button>
          </div>
          <input id="spec-search" type="text" placeholder="搜尋型號或規格..." oninput="renderSpecs()" style="min-width:220px;" />
        </div>
      </div>
      <div id="specs-table-container"></div>
    </section>

    <!-- TAB 4: DECODER -->
    <section id="tab-decoder" class="hidden">
      <div class="card">
        <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end;">
          <div>
            <h2 style="margin:0;font-size:18px;">MELSERVO-J5 型號規則與尾碼解析器</h2>
            <p style="margin:4px 0 0;font-size:13px;color:#475569;">輸入放大器型號（例：MR-J5-100G4-RJN1）或點選預設範例</p>
          </div>
          <input id="decoder-input" type="text" placeholder="例：MR-J5-70G-HS" oninput="renderDecoder()" style="min-width:240px;font-family:var(--mono);" />
        </div>
        <div id="decoder-presets" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;"></div>
        <div id="decoder-result" style="margin-top:16px;"></div>
      </div>
      <div class="card">
        <h3 style="margin:0 0 12px;font-size:15px;">常用代碼速查表</h3>
        <div id="decoder-glossary"></div>
      </div>
    </section>
  </main>

  <nav class="nav-mobile">
    <button class="active" data-tab="wizard" onclick="switchTab('wizard')">選型精靈</button>
    <button data-tab="faq" onclick="switchTab('faq')">技術問答</button>
    <button data-tab="specs" onclick="switchTab('specs')">規格總覽</button>
    <button data-tab="decoder" onclick="switchTab('decoder')">型號解析</button>
  </nav>

援 CN2 2線式全閉環與基本 STO (Cat.3 PLd/SIL2)。-RJ 追加 CN2L 端子支援 4線式串列與 A/B/Z 相差動光學尺，並內建完整安全監視 (STO/SS1/SS2/SOS/SBC/SLS/SSM/SDI/SLI/SLT) 可透過 CN8 或網路安全通信觸發。-HS 則於 CN3 直接整合 3 系統安全 DI/DO (Cat.4 PLe/SIL3)，無須搭配安全 PLC 即可獨立運作，並附 CN2L 與 CN7 脈衝輸出，但本體保護等級為 IP00 (0.1~7kW)。"},{"category":"接線與編碼器","q":"線性馬達全閉環與熱敏電阻 (CN2 / CN2L) 接線有何防呆限制？","a":"2線式串列光學尺與馬達感溫線均經 CN2 連接，必須分別使用 MR-J4FCCBL03M (全閉環分歧線) 與 MR-J4THCBL03M (熱敏電阻線)，兩條線材嚴禁混用誤插。若採用 4線式串列或 A/B/Z 差動光學尺，則須選配 -RJ、-HS 或 MR-J5D1-G4 並將光學尺接至 CN2L / CN2AL，感溫線仍經 MR-J4THCBL03M 接於 CN2。"},{"category":"通信週期限制","q":"達成 31.25 μs 最速通信週期的條件與各機能週期下限？","a":"31.25 μs 與 62.5 μs 須搭配 RD78GH 控制器與韌體 A6 以上之 1 軸 MR-J5-G (或 D1-G4)。開啟以下機能時最小週期將受限：全閉環 125 μs (1軸) / 250 μs (W2/D2)；TSN 網路安全通信 125 μs (-RJ/-HS/D1) / 250 μs (-N1) / 500 μs (W2/W3/D2/D3)；pp/pv/tq 定位模式 250 μs (1軸) / 500 μs (多軸)；-N1 (EtherCAT) 最小 125 μs 且不支援押付運轉與驅動器間通信。"},{"category":"J4 升級置換","q":"從 MELSERVO-J4 (HG 馬達) 升級至 J5 的相容性？","a":"透過 SSCNET III/H 對應機種 MR-J5-B (搭配特定韌體/參數設定) 可保留既有 HG 系列馬達與部分既有架構；若全面改用 HK 馬達搭配 10m 以內單接頭電纜，可使用 MR-AEP1CBL (無煞車) 或 MR-AEPB1CBL (含煞車) 單線化減少配線；超過 10m 則需使用 MR-J10CBL03M (IP20) 或 MR-J20CBL03M (IP65) 中繼延長線組。"},{"category":"多軸與電源","q":"單相 AC100V、AC200V 與 400V 共直流母線 (MR-J5D) 的使用限制？","a":"1) 單相 AC100~120V 須透過 MR-CM08K1，總容量限 0.8kW 且最多 3 軸，不支援線性/直驅馬達。2) 單相 AC200V 驅動 1kW~2kW 機種時實效負載率須 ≤75%，且不對應 SEMI F47。3) MR-J5W3 寬度僅 75mm 但不支援全閉環。4) 400V 共母線 MR-J5D1/D2/D3-G4 需搭 MR-CV_4 變流器，僅限驅動「旋轉馬達」，不支援線性與直驅馬達，且總寬度 ≤1500mm。"},{"category":"再生與制動","q":"12kW~25kW 大容量機種的動力制動 (DB) 與 SEMI F47 注意事項？","a":"MR-J5-12K / 17K / 25K 放大器未內建動力制動與再生電阻，標準需外接 DBU-11K/15K/22K-R1 (400V 為 DBU-11K-4 / 22K-4) 與 GRZG400 外置再生電阻。若機台須符合 SEMI F47 瞬停規範，則不可安裝外接 DBU 單元；此外，斷電檢修前請確認充電燈熄滅且靜置至少 15 分鐘 (MR-J5D 需 20 分鐘)。"}],"initialCriteria":{"motorCategory":"rotary","powerSupply":"3p-200v","protocol":"cc-link-tsn","topology":"1-axis","axesCount":4,"safety":"sto","feedback":"semi-closed","holdingBrake":false,"rotaryInertia":"low-inertia","targetPowerKw":0.4,"torqueBoost":false,"linearType":"iron-core-modular","targetThrustN":240,"strokeMm":500,"ddMounting":"flange","targetDdTorqueNm":4.5,"ddAbsolute":true}};
    let state = Object.assign({}, DATA.initialCriteria);
    let currentTab = 'wizard';
    let currentSpec = 'amplifiers';
    let activePresetIdx = 0;

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function switchTab(tab) {
      currentTab = tab;
      ['wizard','faq','specs','decoder'].forEach(t => {
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
      });
      document.querySelectorAll('[data-tab]').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
      });
      const titles = {
        wizard: 'SV J5 互動式選型精靈',
        faq: '技術問答速查與知識庫',
        specs: 'MELSERVO-J5 規格矩陣總覽',
        decoder: '型號編碼與尾碼解析'
      };
      document.getElementById('page-title').textContent = titles[tab];
    }

    function updateState(k, v) {
      state[k] = v;
      if (k === 'powerSupply' && v === '3p-400v' && (state.topology === '2-axis' || state.topology === '3-axis' || state.topology === 'common-bus-200v')) {
        state.topology = '1-axis';
      }
      if (k === 'powerSupply' && v !== '3p-400v' && state.topology === 'dc-bus-400v') {
        state.topology = '1-axis';
      }
      if (k === 'powerSupply' && v === 'dc-48v') {
        state.motorCategory = 'rotary';
        state.topology = '3-axis';
        state.axesCount = 3;
      }
      renderWizard();
    }

    function computeBom(c) {
      const warnings = [];
      const bom = [];
      let valid = true;
      const protoMap = { 'cc-link-tsn':'G', 'ethercat':'G', 'ethernet-ip':'G', 'sscnet':'B', 'pulse-analog':'A' };
      const protoCode = protoMap[c.protocol] || 'G';
      const isN1 = c.protocol === 'ethercat' || c.protocol === 'ethernet-ip';
      const needRJ = c.safety === 'advanced-safety' || c.feedback === 'full-closed-4wire-abz';
      const needHS = c.safety === 'standalone-hs';
      let suffix = '';
      if (c.protocol === 'sscnet' || c.protocol === 'pulse-analog') {
        suffix = (needRJ || needHS) ? '-RJ' : '';
      } else if (needHS) {
        suffix = isN1 ? '-HSN1' : '-HS';
      } else if (needRJ) {
        suffix = isN1 ? '-RJN1' : '-RJ';
      } else if (isN1) {
        suffix = '-N1';
      }

      if (c.powerSupply === 'dc-48v') {
        if (c.motorCategory !== 'rotary') { valid = false; warnings.push('DC48V MR-MD333G 僅支援超小型旋轉馬達。'); }
        const amp = c.protocol === 'ethercat' ? 'MR-MD333G-N1' : 'MR-MD333G';
        bom.push({ cat:'基板型 3 軸模組', part: amp, qty: Math.ceil(c.axesCount/3)+' 組', desc:'DC48V、30W×3軸、耐振 39 m/s²' });
        bom.push({ cat:'DC48V 伺服馬達', part: c.holdingBrake ? 'HK-KT0536E2B-S1' : 'HK-KT0536E2-S1', qty: c.axesCount+' 顆', desc:'50W、26-bit 無電池絕對型' });
        return { valid, bom, warnings, cycle: '250 μs', kva: '0.08 kW (DC48V)' };
      }

      const ctrl = DATA.controllers.find(x => x.protocol.includes(c.protocol));
      if (ctrl) bom.push({ cat:'建議控制器', part: ctrl.model, qty:'1 套', desc: ctrl.series + ' (' + ctrl.minCycleUs + ')' });

      const is400 = c.powerSupply === '3p-400v';
      const vCode = is400 ? '4' : '';
      const fmtCap = kw => kw<=0.1?'10':kw<=0.2?'20':kw<=0.4?'40':kw<=0.6?'60':kw<=0.75?'70':kw<=1?'100':kw<=2?'200':kw<=3.5?'350':kw<=5?'500':kw<=7?'700':kw<=11?'12K':kw<=15?'17K':'25K';

      if (c.motorCategory === 'rotary') {
        let pool = DATA.rotaryMotors.filter(m => m.voltage !== '48V' && (is400 ? !!m.standardAmp400 : m.voltage === '200V'));
        if (c.rotaryInertia === 'medium-inertia') pool = pool.filter(m => m.series === 'HK-ST');
        else if (c.rotaryInertia === 'ultra-low') pool = pool.filter(m => m.series === 'HK-MT' || m.series === 'HK-RT');
        else if (c.rotaryInertia === 'large-capacity') pool = pool.filter(m => m.series === 'HK-JT');
        else if (c.rotaryInertia === 'high-speed') pool = pool.filter(m => m.maxSpeedRpm >= 10000);
        else pool = pool.filter(m => m.series === 'HK-KT');
        if (!pool.length) pool = DATA.rotaryMotors.filter(m => m.voltage === (is400 ? '400V' : '200V'));
        pool.sort((a,b)=>a.powerKw-b.powerKw);
        const m = pool.find(x => x.powerKw >= c.targetPowerKw) || pool[pool.length-1];
        const ampPart = (c.topology === '2-axis' || c.topology === '3-axis') && !is400
          ? 'MR-J5' + (c.topology === '3-axis' ? 'W3-' : 'W2-') + (c.topology === '3-axis' ? (m.powerKw<=0.2?'222':'444') : (m.powerKw<=0.2?'22':m.powerKw<=0.4?'44':m.powerKw<=0.75?'77':'1010')) + (c.protocol==='sscnet'?'B':'G') + (isN1?'-N1':'')
          : 'MR-J5-' + fmtCap(m.powerKw) + protoCode + vCode + suffix;
        bom.push({ cat:'伺服放大器', part: ampPart, qty: c.axesCount+' 台', desc: (is400?'400V':'200V') + ' 伺服放大器' });
        bom.push({ cat:'旋轉伺服馬達', part: c.holdingBrake ? m.model.replace('W(B)','WB') : m.model.replace('W(B)','W'), qty: c.axesCount+' 顆', desc: m.powerKw+' kW · '+m.ratedTorqueNm+' N·m · 法蘭 □'+m.flangeMm+' mm' });
        if (m.powerKw >= 11) bom.push({ cat:'外置制動/再生', part: is400?'DBU-11K-4 + GRZG400':'DBU-11K-R1 + GRZG400', qty: c.axesCount+' 組', desc:'12~25kW 必選外置動力制動與再生電阻' });
      } else if (c.motorCategory === 'linear') {
        const lm = DATA.linearMotors.find(x => x.contThrustN >= c.targetThrustN) || DATA.linearMotors[0];
        bom.push({ cat:'伺服放大器', part: 'MR-J5-100'+protoCode+vCode+suffix, qty: c.axesCount+' 台', desc:'依推力配置 (請以 Motorizer 複核實效電流)' });
        bom.push({ cat:'線性馬達一次側', part: lm.model, qty: c.axesCount+' 組', desc: lm.coreType + ' · 連續 ' + lm.contThrustN + ' N' });
        bom.push({ cat:'二次側磁軌', part: lm.secondaryModel, qty: c.axesCount+' 排', desc: '建議總長 ≥ ' + (c.strokeMm + lm.primaryLengthMm) + ' mm' });
        warnings.push('CN2 嚴禁混用 MR-J4FCCBL03M (全閉環) 與 MR-J4THCBL03M (感溫線)。');
      } else {
        const dd = DATA.directDriveMotors.find(x => x.ratedTorqueNm >= c.targetDdTorqueNm) || DATA.directDriveMotors[0];
        bom.push({ cat:'伺服放大器', part: 'MR-J5-40'+protoCode+vCode+suffix, qty: c.axesCount+' 台', desc:'直驅馬達驅動用放大器' });
        bom.push({ cat:'直驅馬達 (TM)', part: dd.model, qty: c.axesCount+' 顆', desc: '外徑 φ'+dd.outerDiaMm+'mm · 額定 '+dd.ratedTorqueNm+' N·m' });
        if (c.ddAbsolute) bom.push({ cat:'絕對位置電池', part:'MR-BTAS01 + MR-BAT6V1SET', qty: c.axesCount+' 套', desc:'TM 直驅建構絕對位置必選' });
      }

      if (c.powerSupply === '1p-100v') bom.push({ cat:'AC100V 電源變換器', part:'MR-CM08K1', qty:'1 台', desc:'限總容量 0.8kW、最多 3 軸 (僅旋轉馬達)' });
      if (isN1) warnings.push('-N1 (EtherCAT/EIP) 不支援押付運轉與驅動器間通信。');

      const minCycle = c.protocol === 'cc-link-tsn' ? (c.topology==='3-axis'||c.safety!=='sto'||c.feedback!=='semi-closed'?'125 μs':c.topology==='2-axis'?'62.5 μs':'31.25 μs') : c.protocol==='ethercat'?'125 μs':c.protocol==='sscnet'?'222 μs':'即時脈衝';
      return { valid, bom, warnings, cycle: minCycle, kva: (c.motorCategory==='rotary'? (c.targetPowerKw*1.7).toFixed(1)+' kVA':'依 Motorizer') };
    }

    function optBtn(active, title, sub, onclickJs) {
      return '<button type="button" class="opt-btn '+(active?'active':'')+'" onclick="'+onclickJs+'"><div class="t">'+esc(title)+'</div><div class="s">'+esc(sub)+'</div></button>';
    }

    function renderWizard() {
      const stepsEl = document.getElementById('wizard-steps');
      const kws = [0.1, 0.2, 0.4, 0.75, 1.0, 2.0, 3.5, 5.0, 7.0, 11.0];
      stepsEl.innerHTML = [
        '<div class="card"><div class="card-head"><div><div class="step-tag">STEP 01</div><h2 class="card-title">機構驅動型式與軸數</h2></div><div><label style="font-size:12px;margin-right:6px;">軸數</label><input type="number" min="1" max="256" style="width:72px;text-align:center;" value="'+state.axesCount+'" onchange="updateState(\'axesCount\', Math.max(1, Number(this.value)||1))" /></div></div>' +
        '<div class="opt-grid cols-3">' +
          optBtn(state.motorCategory==='rotary','旋轉伺服 (HK)','26-bit 無電池絕對型',"updateState('motorCategory','rotary')") +
          optBtn(state.motorCategory==='linear','線性伺服 (LM)','高速高加減速 / 無鐵芯',"updateState('motorCategory','linear')") +
          optBtn(state.motorCategory==='direct','直驅馬達 (TM)','零背隙大中空轉盤',"updateState('motorCategory','direct')") +
        '</div>' +
        '<span class="label-sm">放大器拓樸架構</span><div class="opt-grid cols-2">' +
          optBtn(state.topology==='1-axis','1 軸獨立型','全容量 0.1~25 kW 完整支援',"updateState('topology','1-axis')") +
          optBtn(state.topology==='2-axis','2 軸一體 (MR-J5W2)','200V 0.2~1.0 kW×2 可混搭',"updateState('topology','2-axis')") +
          optBtn(state.topology==='3-axis','3 軸一體 (MR-J5W3)','75mm 極窄寬度 (≤0.4kW)',"updateState('topology','3-axis')") +
          optBtn(state.topology==='dc-bus-400v','400V 共直流母線 (MR-J5D)','搭 MR-CV 變流器(限旋轉)',"updateState('topology','dc-bus-400v')") +
        '</div></div>',

        '<div class="card"><div class="card-head"><div><div class="step-tag">STEP 02</div><h2 class="card-title">電源與通信協定</h2></div></div>' +
        '<div class="opt-grid cols-3">' +
          optBtn(state.powerSupply==='3p-200v','三相 AC 200V','主流標準 (0.1~25kW)',"updateState('powerSupply','3p-200v')") +
          optBtn(state.powerSupply==='1p-200v','單相 AC 200V','0.1~2kW (>750W 限75%)',"updateState('powerSupply','1p-200v')") +
          optBtn(state.powerSupply==='3p-400v','三相 AC 400V','大型機台與外銷規格',"updateState('powerSupply','3p-400v')") +
          optBtn(state.powerSupply==='1p-100v','單相 AC 100V','搭 MR-CM08K1 (≤0.8kW)',"updateState('powerSupply','1p-100v')") +
          optBtn(state.powerSupply==='dc-48v','DC 48V 基板型','MR-MD333G (30W×3軸)',"updateState('powerSupply','dc-48v')") +
        '</div>' +
        '<span class="label-sm">控制網路介面</span><div class="opt-grid cols-2">' +
          optBtn(state.protocol==='cc-link-tsn','CC-Link IE TSN (-G)','1Gbps TSN · 最速 31.25 μs',"updateState('protocol','cc-link-tsn')") +
          optBtn(state.protocol==='ethercat','EtherCAT (-G-N1)','CoE/EoE/FSoE · 125 μs',"updateState('protocol','ethercat')") +
          optBtn(state.protocol==='sscnet','SSCNET III/H (-B)','光纖 222 μs · 相容 HG 馬達',"updateState('protocol','sscnet')") +
          optBtn(state.protocol==='pulse-analog','脈衝列 / 類比 (-A)','4Mpps / ±10V / 內建點表',"updateState('protocol','pulse-analog')") +
        '</div></div>',

        '<div class="card"><div class="card-head"><div><div class="step-tag">STEP 03</div><h2 class="card-title">負載功率 / 推力與安全回授</h2></div></div>' +
        (state.motorCategory==='rotary'
          ? '<span class="label-sm" style="margin-top:0;">目標額定功率 (kW)</span><div class="kw-strip">' +
            kws.map(k => '<button type="button" class="kw-btn '+(state.targetPowerKw===k?'active':'')+'" onclick="updateState(\'targetPowerKw\','+k+')">'+(k<1?(k*1000)+'W':k+'kW')+'</button>').join('') +
            '</div><div style="margin-top:12px;"><label style="font-size:13px;cursor:pointer;"><input type="checkbox" '+(state.holdingBrake?'checked':'')+' onchange="updateState(\'holdingBrake\',this.checked)" /> 加配保持電磁煞車 (B)</label></div>'
          : state.motorCategory==='linear'
          ? '<div class="opt-grid cols-2"><div><label class="label-sm">需求連續推力 (N)</label><input type="number" value="'+state.targetThrustN+'" onchange="updateState(\'targetThrustN\',Number(this.value)||200)" /></div><div><label class="label-sm">行程 (mm)</label><input type="number" value="'+state.strokeMm+'" onchange="updateState(\'strokeMm\',Number(this.value)||500)" /></div></div>'
          : '<div><label class="label-sm">需求額定轉矩 (N·m)</label><input type="number" value="'+state.targetDdTorqueNm+'" onchange="updateState(\'targetDdTorqueNm\',Number(this.value)||4.5)" /></div>'
        ) +
        '<span class="label-sm">安全機能與全閉環回授</span><div class="opt-grid cols-3">' +
          optBtn(state.safety==='sto','基本 STO','CN8 硬體遮斷',"updateState('safety','sto')") +
          optBtn(state.safety==='advanced-safety','安全監視 (-RJ)','STO~SLT 完整監視 + CN2L',"updateState('safety','advanced-safety')") +
          optBtn(state.safety==='standalone-hs','獨立安全 (-HS)','CN3 3系統 DI/DO PLe',"updateState('safety','standalone-hs')") +
        '</div>' +
        '<div class="opt-grid cols-3" style="margin-top:10px;">' +
          optBtn(state.feedback==='semi-closed','半閉環','馬達 26-bit 編碼器',"updateState('feedback','semi-closed')") +
          optBtn(state.feedback==='full-closed-2wire','2線全閉環','經 CN2 連接',"updateState('feedback','full-closed-2wire')") +
          optBtn(state.feedback==='full-closed-4wire-abz','4線 / ABZ 全閉環','經 CN2L (-RJ/-HS)',"updateState('feedback','full-closed-4wire-abz')") +
        '</div></div>'
      ].join('');

      const res = computeBom(state);
      const bomEl = document.getElementById('bom-panel');
      bomEl.innerHTML =
        '<div style="font-size:12px;font-weight:700;color:#E60012;">即時建議選型清單 (BOM)</div>' +
        '<div class="metrics-row"><div><div style="font-size:11px;color:#64748B;">單軸電源預估</div><div class="mono" style="font-weight:700;">'+esc(res.kva)+'</div></div>' +
        '<div><div style="font-size:11px;color:#64748B;">最小通信週期</div><div class="mono" style="font-weight:700;">'+esc(res.cycle)+'</div></div></div>' +
        (res.warnings.length ? '<div class="warn-box '+(res.valid?'':'error')+'"><strong>選型提醒：</strong><br/>'+res.warnings.map(esc).join('<br/>')+'</div>' : '') +
        '<div class="bom-list">' +
        res.bom.map(b => '<div class="bom-item"><div style="display:flex;justify-content:space-between;font-size:11px;color:#64748B;"><span>'+esc(b.cat)+'</span><span class="mono">'+esc(b.qty)+'</span></div><div class="mono" style="font-weight:700;font-size:14px;margin:2px 0;">'+esc(b.part)+'</div><div style="font-size:12px;color:#475569;">'+esc(b.desc)+'</div></div>').join('') +
        '</div>' +
        '<div style="margin-top:12px;display:flex;gap:8px;"><button type="button" class="btn-primary" style="flex:1;" onclick="copyBom(this)">複製 BOM 清單</button></div>';
    }

    function copyBom(btn) {
      const res = computeBom(state);
      const txt = res.bom.map(b => b.cat + ': ' + b.part + ' (' + b.qty + ') - ' + b.desc).join('\n');
      navigator.clipboard && navigator.clipboard.writeText(txt).then(() => {
        btn.textContent = '已複製到剪貼簿';
        setTimeout(() => btn.textContent = '複製 BOM 清單', 2000);
      });
    }

    function renderFaq() {
      const q = (document.getElementById('faq-search').value || '').trim().toLowerCase();
      const items = DATA.faqs.filter(f => !q || f.q.toLowerCase().includes(q) || f.a.toLowerCase().includes(q) || f.category.toLowerCase().includes(q));
      document.getElementById('faq-list').innerHTML = items.map(f =>
        '<div class="card"><div style="font-size:11px;font-weight:700;color:#E60012;">'+esc(f.category)+'</div>' +
        '<h3 style="margin:4px 0 8px;font-size:15px;">'+esc(f.q)+'</h3>' +
        '<p style="margin:0;font-size:13px;color:#334155;line-height:1.65;">'+esc(f.a)+'</p></div>'
      ).join('') || '<div class="card">查無符合關鍵字之解答。</div>';
    }

    function switchSpec(spec) {
      currentSpec = spec;
      document.querySelectorAll('[data-spec]').forEach(b => b.classList.toggle('active', b.getAttribute('data-spec') === spec));
      renderSpecs();
    }

    function renderSpecs() {
      const q = (document.getElementById('spec-search').value || '').trim().toLowerCase();
      let html = '';
      if (currentSpec === 'amplifiers') {
        const rows = DATA.amplifiers.filter(a => !q || a.series.toLowerCase().includes(q) || a.typeLabel.toLowerCase().includes(q) || a.protocols.toLowerCase().includes(q));
        html = '<div class="table-wrap"><table><thead><tr><th>系列</th><th>電壓/容量</th><th>協定與最小週期</th><th>全閉環與安全</th></tr></thead><tbody>' +
          rows.map(a => '<tr><td><strong class="mono">'+esc(a.series)+'</strong><div style="font-size:12px;color:#64748B;">'+esc(a.typeLabel)+'</div></td><td class="mono">'+esc(a.voltage)+'</td><td>'+esc(a.protocols)+'<div class="mono" style="font-size:12px;color:#64748B;">Min: '+esc(a.minCycle)+'</div></td><td style="font-size:12px;">'+esc(a.fullClosedSupport)+'<br/>'+esc(a.safetyFunctions)+'</td></tr>').join('') +
          '</tbody></table></div>';
      } else if (currentSpec === 'controllers') {
        const rows = DATA.controllers.filter(c => !q || c.model.toLowerCase().includes(q) || c.series.toLowerCase().includes(q));
        html = '<div class="table-wrap"><table><thead><tr><th>型號</th><th>軸數上限</th><th>最小週期</th><th>特性</th></tr></thead><tbody>' +
          rows.map(c => '<tr><td><strong class="mono">'+esc(c.model)+'</strong><div style="font-size:12px;color:#64748B;">'+esc(c.series)+'</div></td><td class="mono">'+esc(c.maxAxes)+'</td><td class="mono">'+esc(c.minCycleUs)+'</td><td style="font-size:12px;">'+esc(c.highlights)+'</td></tr>').join('') +
          '</tbody></table></div>';
      } else if (currentSpec === 'rotary') {
        const rows = DATA.rotaryMotors.filter(m => !q || m.model.toLowerCase().includes(q) || m.series.toLowerCase().includes(q));
        html = '<div class="table-wrap"><table><thead><tr><th>馬達型號</th><th>功率 (kW)</th><th>額定/最大轉矩 (N·m)</th><th>轉速 (r/min)</th><th>搭配放大器</th></tr></thead><tbody>' +
          rows.map(m => '<tr><td class="mono"><strong>'+esc(m.model)+'</strong><div style="font-size:11px;color:#64748B;">'+esc(m.voltage+' · '+m.inertiaLabel)+'</div></td><td class="mono">'+m.powerKw+'</td><td class="mono">'+m.ratedTorqueNm+' / '+m.maxTorqueNm+'</td><td class="mono">'+m.ratedSpeedRpm+' / '+m.maxSpeedRpm+'</td><td class="mono" style="font-size:12px;">'+esc(m.standardAmp200 || m.standardAmp400)+'</td></tr>').join('') +
          '</tbody></table></div>';
      } else {
        const rows = DATA.linearMotors.filter(l => !q || l.series.toLowerCase().includes(q) || l.coreType.toLowerCase().includes(q));
        html = '<div class="table-wrap"><table><thead><tr><th>線性系列</th><th>結構</th><th>代表推力 (連續/最大)</th><th>最高速度</th><th>說明</th></tr></thead><tbody>' +
          rows.map(l => '<tr><td class="mono"><strong>'+esc(l.series)+'</strong><div style="font-size:11px;color:#64748B;">'+esc(l.model)+'</div></td><td>'+esc(l.coreType)+'</td><td class="mono">'+l.contThrustN+' / '+l.maxThrustN+' N</td><td class="mono">'+l.maxSpeedMs+' m/s</td><td style="font-size:12px;">'+esc(l.notes)+'</td></tr>').join('') +
          '</tbody></table></div>';
      }
      document.getElementById('specs-table-container').innerHTML = html;
    }

    function renderDecoder() {
      document.getElementById('decoder-presets').innerHTML = DATA.decoderPresets.map((p, idx) =>
        '<button type="button" class="kw-btn '+(idx===activePresetIdx && !document.getElementById('decoder-input').value?'active':'')+'" onclick="activePresetIdx='+idx+';document.getElementById(\'decoder-input\').value=\'\';renderDecoder()">'+esc(p.fullCode)+'</button>'
      ).join('');
      const custom = (document.getElementById('decoder-input').value || '').trim().toUpperCase();
      let segments = DATA.decoderPresets[activePresetIdx].segments;
      if (custom) {
        segments = [];
        Object.keys(DATA.glossary).forEach(tok => {
          if (custom.includes(tok)) segments.push({ code: tok, label: DATA.glossary[tok].title, meaning: DATA.glossary[tok].detail });
        });
        if (!segments.length) segments.push({ code: custom, label: '自訂輸入', meaning: '請輸入標準前綴如 MR-J5、W2、G、4、-RJ、-HS、-N1 以檢視說明。' });
      }
      document.getElementById('decoder-result').innerHTML = '<div class="bom-list">' +
        segments.map(s => '<div class="bom-item"><strong class="mono" style="color:#E60012;font-size:15px;">'+esc(s.code)+'</strong> <span style="font-weight:600;margin-left:8px;">'+esc(s.label)+'</span><div style="font-size:13px;color:#475569;margin-top:4px;">'+esc(s.meaning)+'</div></div>').join('') +
        '</div>';
      document.getElementById('decoder-glossary').innerHTML = '<div class="bom-list">' +
        Object.entries(DATA.glossary).map(([k,v]) => '<div class="bom-item"><span class="mono" style="font-weight:700;display:inline-block;min-width:96px;">'+esc(k)+'</span><strong>'+esc(v.title)+'</strong><div style="font-size:12px;color:#475569;margin-top:2px;">'+esc(v.detail)+'</div></div>').join('') +
        '</div>';
    }

    renderWizard();
    renderFaq();
    renderSpecs();
    renderDecoder();
  </script>
</body>
</html>
