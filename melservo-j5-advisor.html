<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MELSERVO-J5 選型與馬達尺寸圖顧問</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-muted: #F1F5F9;
      --ink: #0F172A;
      --ink-secondary: #475569;
      --border: #E2E8F0;
      --accent: #E60012;
      --accent-hover: #C80010;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
    }
    .nav-desktop {
      display: none;
      gap: 4px;
    }
    @media (min-width: 768px) {
      .nav-desktop { display: flex; }
      .nav-mobile { display: none !important; }
    }
    .nav-btn {
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 0;
      background: transparent;
      color: var(--ink-secondary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .nav-btn.active {
      background: var(--ink);
      color: #FFFFFF;
    }
    .nav-btn:hover:not(.active) { background: var(--surface-muted); color: var(--ink); }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 16px 88px;
    }
    @media (min-width: 768px) { main { padding: 28px 24px 48px; } }
    .page-head {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .page-head h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .page-head p { margin: 6px 0 0; font-size: 13px; color: var(--ink-secondary); }
    .grid-wizard {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (min-width: 1024px) {
      .grid-wizard { grid-template-columns: 7fr 5fr; }
      .grid-dim { grid-template-columns: 4fr 8fr; }
      .sticky-aside { position: sticky; top: 76px; }
    }
    .grid-dim {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .step-tag { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent); }
    .card-title { margin: 2px 0 0; font-size: 16px; font-weight: 700; }
    .card-head {
      border-bottom: 1px solid #F1F5F9;
      padding-bottom: 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .opt-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) { .opt-grid.cols-2 { grid-template-columns: 1fr 1fr; } .opt-grid.cols-3 { grid-template-columns: repeat(3, 1fr); } }
    .opt-btn {
      min-height: 52px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .opt-btn:hover { border-color: #CBD5E1; background: #F8FAFC; }
    .opt-btn.active {
      border-color: var(--accent);
      background: rgba(230, 0, 18, 0.04);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .opt-btn .t { font-size: 14px; font-weight: 600; color: var(--ink); }
    .opt-btn.active .t { color: var(--accent); }
    .opt-btn .s { font-size: 12px; color: var(--ink-secondary); margin-top: 3px; }
    .kw-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .kw-btn {
      min-height: 40px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--ink);
    }
    .kw-btn.active { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
    input[type="number"], input[type="text"], select {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      font-size: 14px;
      background: #F8FAFC;
      color: var(--ink);
    }
    input:focus, select:focus { outline: 2px solid rgba(230, 0, 18, 0.25); border-color: var(--accent); background: #FFFFFF; }
    .metrics-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #F8FAFC;
      margin: 12px 0;
    }
    .metrics-row > div { padding: 10px 12px; }
    .metrics-row > div:first-child { border-right: 1px solid var(--border); }
    .metrics-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    @media (min-width: 640px) { .metrics-4 { grid-template-columns: repeat(4, 1fr); } }
    .metric-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #F8FAFC;
      padding: 10px 12px;
    }
    .metric-box .k { font-size: 11px; color: #64748B; }
    .metric-box .v { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--ink); margin-top: 2px; }
    .bom-list { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .bom-item { padding: 12px 14px; border-bottom: 1px solid var(--border); background: #FFFFFF; }
    .bom-item:last-child { border-bottom: 0; }
    .remark-box {
      margin-top: 6px;
      font-size: 11px;
      color: #475569;
      background: #F8FAFC;
      border: 1px solid #F1F5F9;
      border-radius: 6px;
      padding: 5px 8px;
    }
    .warn-box {
      border: 1px solid #FDE68A;
      background: #FFFBEB;
      color: #78350F;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .warn-box.error { border-color: #FCA5A5; background: #FEF2F2; color: #7F1D1D; }
    .btn-primary {
      min-height: 46px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 0;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-outline {
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-sm {
      min-height: 36px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: #FFFFFF; }
    table { width: 100%; min-width: 680px; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #F8FAFC; padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--ink-secondary); font-weight: 600; }
    td { padding: 11px 14px; border-bottom: 1px solid #F1F5F9; vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    .dim-table { min-width: 100%; }
    .dim-svg { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--border); background: #FFFFFF; display: block; }
    .nav-mobile {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      height: 56px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }
    .nav-mobile button {
      border: 0;
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
      min-height: 44px;
    }
    .nav-mobile button.active { color: var(--accent); }
    .hidden { display: none !important; }
    .label-sm { font-size: 12px; font-weight: 600; color: var(--ink-secondary); margin: 12px 0 8px; display: block; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <svg width="22" height="20" viewBox="0 0 24 22" fill="none" aria-hidden="true">
          <polygon points="12,1 16,8 12,15 8,8" fill="#E60012" />
          <polygon points="12,15 4,15 0,21 8,21" fill="#E60012" />
          <polygon points="12,15 20,15 24,21 16,21" fill="#E60012" />
        </svg>
        <span>MELSERVO-J5 選型顧問</span>
      </div>
      <nav class="nav-desktop">
        <button class="nav-btn active" data-tab="wizard" onclick="switchTab('wizard')">選型精靈</button>
        <button class="nav-btn" data-tab="dimensions" onclick="switchTab('dimensions')">馬達尺寸圖</button>
        <button class="nav-btn" data-tab="specs" onclick="switchTab('specs')">規格總覽</button>
        <button class="nav-btn" data-tab="decoder" onclick="switchTab('decoder')">型號解析</button>
      </nav>
      <div class="mono" style="font-size:12px;color:#64748B;">L(NA)03180CHN-K</div>
    </div>
  </header>

  <main>
    <div class="page-head">
      <h1 id="page-title">SV J5 互動式選型精靈</h1>
      <p>速度頻寬 3.5 kHz · 最速通信週期 31.25 μs · 26-bit 無電池絕對型編碼器</p>
    </div>

    <!-- TAB 1: WIZARD -->
    <section id="tab-wizard" class="grid-wizard">
      <div id="wizard-steps"></div>
      <aside class="sticky-aside">
        <div class="card" id="bom-panel"></div>
      </aside>
    </section>

    <!-- TAB 2: MOTOR DIMENSIONS -->
    <section id="tab-dimensions" class="hidden grid-dim">
      <div id="dim-controls"></div>
      <div id="dim-preview"></div>
    </section>

    <!-- TAB 3: SPECS -->
    <section id="tab-specs" class="hidden">
      <div class="card">
        <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;">
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <button class="kw-btn active" data-spec="amplifiers" onclick="switchSpec('amplifiers')">伺服放大器</button>
            <button class="kw-btn" data-spec="controllers" onclick="switchSpec('controllers')">運動控制器</button>
            <button class="kw-btn" data-spec="rotary" onclick="switchSpec('rotary')">旋轉馬達 HK</button>
            <button class="kw-btn" data-spec="linear" onclick="switchSpec('linear')">線性 LM / 直驅 TM</button>
          </div>
          <input id="spec-search" type="text" placeholder="搜尋型號或規格..." oninput="renderSpecs()" style="min-width:220px;" />
        </div>
      </div>
      <div id="specs-table-container"></div>
    </section>

    <!-- TAB 4: DECODER -->
    <section id="tab-decoder" class="hidden">
      <div class="card">
        <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end;">
          <div>
            <h2 style="margin:0;font-size:18px;">MELSERVO-J5 型號規則與尾碼解析器</h2>
            <p style="margin:4px 0 0;font-size:13px;color:#475569;">輸入放大器型號（例：MR-J5-100G4-RJN1）或點選預設範例</p>
          </div>
          <input id="decoder-input" type="text" placeholder="例：MR-J5-70G-HS" oninput="renderDecoder()" style="min-width:240px;font-family:var(--mono);" />
        </div>
        <div id="decoder-presets" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;"></div>
        <div id="decoder-result" style="margin-top:16px;"></div>
      </div>
      <div class="card">
        <h3 style="margin:0 0 12px;font-size:15px;">常用代碼速查表</h3>
        <div id="decoder-glossary"></div>
      </div>
    </section>
  </main>

  <nav class="nav-mobile">
    <button class="active" data-tab="wizard" onclick="switchTab('wizard')">選型精靈</button>
    <button data-tab="dimensions" onclick="switchTab('dimensions')">馬達尺寸圖</button>
    <button data-tab="specs" onclick="switchTab('specs')">規格總覽</button>
    <button data-tab="decoder" onclick="switchTab('decoder')">型號解析</button>
  </nav>

      if (typeof strokeMm === 'number' && strokeMm >= 50) dimState.strokeMm = strokeMm;

          DATA.rotaryDimensions[0];
        if (hit) {

          dimState.series = hit.series;

      const axes = Math.max(1, Math.floor(c.axesCount));
      const is400 = c.powerSupply === '3p-400v';
      const vCode = is400 ? '4' : '';
      const protoMap = { 'cc-link-tsn':'G', 'ethercat':'G', 'ethernet-ip':'G', 'sscnet':'B', 'pulse-analog':'A' };
      const protoCode = protoMap[c.protocol] || 'G';
      const isN1 = c.protocol === 'ethercat' || c.protocol === 'ethernet-ip';
      const needRJ = c.safety === 'advanced-safety' || c.feedback === 'full-closed-4wire-abz';
      const needHS = c.safety === 'standalone-hs';
      let suffix = '';
      if (c.protocol === 'sscnet' || c.protocol === 'pulse-analog') {
        suffix = (needRJ || needHS) ? '-RJ' : '';
      } else if (needHS) {
        suffix = isN1 ? '-HSN1' : '-HS';
      } else if (needRJ) {
        suffix = isN1 ? '-RJN1' : '-RJ';
      } else if (isN1) {
        suffix = '-N1';
      }

      let valid = true;
      let totalAmpUnits = 0;

      function pushSingle(qty, catLabel, remark) {
        totalAmpUnits += qty;
        opts.bom.push({
          cat: catLabel,
          part: 'MR-J5-' + opts.singleCap + protoCode + vCode + suffix,
          qty: qty + ' 台',
          desc: (is400 ? '三相 AC400V' : c.powerSupply === '1p-200v' ? '單相/三相 AC200V' : 'AC200V') + ' 1 軸獨立型伺服放大器' + (opts.descSuffix || ''),
          remark: remark || opts.boostRemark || ''
        });
      }

      if (c.topology === 'dc-bus-400v') {
        if (!is400) {
          valid = false;
          opts.warnings.push('400V 共直流母線 (MR-J5D) 僅適用三相 AC 400V 電源，請切換電源為三相 AC 400V。');
        }
        if (c.motorCategory !== 'rotary') {
          valid = false;
          opts.warnings.push('400V 共直流母線驅動模組 MR-J5D1/D2/D3 僅限驅動「旋轉伺服馬達」，不支援線性或直驅馬達。');
        }
        if (c.protocol === 'sscnet' || c.protocol === 'pulse-analog') {
          valid = false;
          opts.warnings.push('MR-J5D 系列僅支援 CC-Link IE TSN (-G4) 與 EtherCAT/EtherNet/IP (-G4-N1)，不支援 SSCNET 或脈衝列。');
        }
        if (opts.perAxisKw > 7.0) {
          valid = false;
          opts.warnings.push('MR-J5D 驅動模組單軸上限為 7.0 kW，11~22 kW 旋轉馬達請改選 1 軸獨立型 MR-J5-12K/17K/25K_4。');
        }
        const dCap = fmtCapD400(opts.perAxisKw);
        const dN1 = isN1 ? '-N1' : '';
        if (c.feedback === 'full-closed-4wire-abz') {
          totalAmpUnits += axes;
          opts.bom.push({
            cat: '400V 1 軸共母線驅動模組',
            part: 'MR-J5D1-' + dCap + 'G4' + dN1,
            qty: axes + ' 台',
            desc: '4 線式/ABZ 全閉環需採用含 CN2AL 之 D1 驅動模組 (1 軸/台)',
            remark: '每台對應 1 軸，共 ' + axes + ' 台'
          });
        } else if (c.feedback === 'semi-closed' && opts.perAxisKw <= 2.0 && axes >= 3) {
          const d3Qty = Math.floor(axes / 3);
          const rem = axes % 3;
          totalAmpUnits += d3Qty;
          opts.bom.push({
            cat: '400V 3 軸共母線驅動模組',
            part: 'MR-J5D3-' + dCap + dCap + dCap + 'G4' + dN1,
            qty: d3Qty + ' 台',
            desc: '3 軸共母線驅動模組 (寬度僅 60 mm)，共驅動 ' + (d3Qty * 3) + ' 軸',
            remark: rem > 0 ? '驅動其中 ' + (d3Qty * 3) + ' 軸，餘 ' + rem + ' 軸由下方模組補齊' : '剛好配足 ' + axes + ' 軸，無空置軸'
          });
          if (rem === 2) {
            totalAmpUnits += 1;
            opts.bom.push({ cat: '補齊餘 2 軸用 400V 驅動模組', part: 'MR-J5D2-' + dCap + dCap + 'G4' + dN1, qty: '1 台', desc: '2 軸共母線驅動模組，補齊剩餘 2 軸', remark: '' });
          } else if (rem === 1) {
            totalAmpUnits += 1;
            opts.bom.push({ cat: '補齊餘 1 軸用 400V 驅動模組', part: 'MR-J5D1-' + dCap + 'G4' + dN1, qty: '1 台', desc: '1 軸共母線驅動模組，補齊剩餘 1 軸', remark: '' });
          }
        } else if (axes >= 2) {
          const d2Qty = Math.floor(axes / 2);
          const rem = axes % 2;
          totalAmpUnits += d2Qty;
          opts.bom.push({
            cat: '400V 2 軸共母線驅動模組',
            part: 'MR-J5D2-' + dCap + dCap + 'G4' + dN1,
            qty: d2Qty + ' 台',
            desc: '2 軸共母線驅動模組 (支援 2 線式全閉環)，共驅動 ' + (d2Qty * 2) + ' 軸',
            remark: rem === 1 ? '驅動其中 ' + (d2Qty * 2) + ' 軸，餘 1 軸搭配 1 台 D1 補齊' : '剛好配足 ' + axes + ' 軸，無空置軸'
          });
          if (rem === 1) {
            totalAmpUnits += 1;
            opts.bom.push({ cat: '補齊餘 1 軸用 400V 驅動模組', part: 'MR-J5D1-' + dCap + 'G4' + dN1, qty: '1 台', desc: '1 軸共母線驅動模組，補齊剩餘 1 軸', remark: '' });
          }
        } else {
          totalAmpUnits += 1;
          opts.bom.push({ cat: '400V 1 軸共母線驅動模組', part: 'MR-J5D1-' + dCap + 'G4' + dN1, qty: '1 台', desc: '1 軸共母線驅動模組 (附 CN2AL 端子)', remark: '單軸系統可評估改用獨立型 MR-J5-G4' });
        }

        const totalKw = opts.perAxisKw * axes;
        const cv = selectConverter400V(totalKw);
        opts.bom.push({
          cat: '400V 電源再生變流器與母線',
          part: cv + ' + MR-AL-_4 + MR-DCBAR' + (totalAmpUnits % 2 === 0 ? ' + MR-DCBAR024-B05' : ''),
          qty: '1 套',
          desc: '依總軸容量約 ' + totalKw.toFixed(1) + ' kW 選配變流器與母線排',
          remark: totalAmpUnits % 2 === 0 ? '共 ' + totalAmpUnits + ' 台驅動模組 (偶數台)，已納入間隔排；總寬 ≤1500 mm' : '共 ' + totalAmpUnits + ' 台驅動模組；總寬 ≤1500 mm'
        });
        return { valid, totalAmpUnits };
      }

      if (c.topology === '2-axis' || c.topology === '3-axis') {
        const isW3 = c.topology === '3-axis';
        if (is400) {
          valid = false;
          opts.warnings.push((isW3 ? '3 軸一體型 MR-J5W3' : '2 軸一體型 MR-J5W2') + ' 僅支援 AC 200V；400V 多軸請改選「400V 共直流母線 (MR-J5D)」或「1 軸獨立型」。');
        }
        if (c.protocol === 'pulse-analog') {
          valid = false;
          opts.warnings.push('多軸一體型 MR-J5W2 / MR-J5W3 無脈衝/類比 (-A) 型號，僅支援 CC-Link IE TSN、EtherCAT/EIP 或 SSCNET III/H。');
        }
        if (isW3 && opts.perAxisKw > 0.4) {
          valid = false;
          opts.warnings.push('3 軸一體型 MR-J5W3 單軸上限為 0.4 kW (444)，目前需求 ' + opts.perAxisKw + ' kW，請改選 MR-J5W2 (≤1.0 kW) 或 1 軸獨立型。');
        }
        if (!isW3 && opts.perAxisKw > 1.0) {
          valid = false;
          opts.warnings.push('2 軸一體型 MR-J5W2 單軸上限為 1.0 kW (1010)，目前需求 ' + opts.perAxisKw + ' kW，請改選 1 軸獨立型放大器。');
        }
        if (!isW3 && c.powerSupply === '1p-200v' && opts.perAxisKw > 0.75) {
          valid = false;
          opts.warnings.push('MR-J5W2-1010 (1.0 kW × 2) 不支援單相 AC 200V 輸入，請改用三相 AC 200V 或 1 軸獨立型。');
        }
        if (isW3 && c.feedback !== 'semi-closed') {
          valid = false;
          opts.warnings.push('MR-J5W3 不支援全閉環控制；有光學尺需求請改選 MR-J5W2 (2線式) 或 1 軸型 (-RJ / -HS)。');
        }
        if (!isW3 && c.feedback === 'full-closed-4wire-abz') {
          valid = false;
          opts.warnings.push('MR-J5W2 僅支援 2 線式串列全閉環；4 線式或 ABZ 差動光學尺請改選 1 軸 -RJ / -HS。');
        }
        if (c.safety === 'standalone-hs') {
          valid = false;
          opts.warnings.push('獨立安全 DI/DO (-HS) 僅提供於 1 軸獨立型放大器，MR-J5W2/W3 係透過網路安全通信實現 STO~SLT。');
        }

        const mProto = c.protocol === 'sscnet' ? 'B' : 'G';
        const mN1 = isN1 ? '-N1' : '';
        const w2Cap = opts.perAxisKw <= 0.2 ? '22' : opts.perAxisKw <= 0.4 ? '44' : opts.perAxisKw <= 0.75 ? '77' : '1010';
        const w3Cap = opts.perAxisKw <= 0.2 ? '222' : '444';
        const pLabel = mProto === 'B' ? 'SSCNET III/H' : mN1 ? 'EtherCAT/EIP' : 'CC-Link IE TSN';

        if (!isW3) {
          if (axes === 1) {
            valid = false;
            opts.warnings.push('目前設備總軸數僅 1 軸，無須使用 2 軸一體型 MR-J5W2，建議改選「1 軸獨立型放大器」。');
            totalAmpUnits += 1;
            opts.bom.push({
              cat: '2 軸一體伺服放大器',
              part: 'MR-J5W2-' + w2Cap + mProto + mN1,
              qty: '1 台',
              desc: '2 軸一體型放大器 (' + pLabel + ') — 僅使用 1 軸，另 1 軸空置',
              remark: ''
            });
          } else {
            const w2Qty = Math.floor(axes / 2);
            const rem = axes % 2;
            totalAmpUnits += w2Qty;
            opts.bom.push({
              cat: '2 軸一體伺服放大器',
              part: 'MR-J5W2-' + w2Cap + mProto + mN1,
              qty: w2Qty + ' 台',
              desc: '2 軸一體型放大器 (' + pLabel + ')，共驅動 ' + (w2Qty * 2) + ' 軸 (每台驅動 2 軸)',
              remark: rem === 0 ? '共 ' + axes + ' 軸 ÷ 2 軸/台 = 剛好 ' + w2Qty + ' 台，無閒置空軸' : '驅動其中 ' + (w2Qty * 2) + ' 軸，餘 1 軸自動搭配下方 1 軸型放大器'
            });
            if (rem === 1) {
              pushSingle(1, '補齊餘 1 軸用 1 軸伺服放大器', '補足奇數總軸數之第 1 軸，避免浪費空軸成本');
            }
          }
        } else {
          if (axes < 3) {
            valid = false;
            opts.warnings.push(axes === 1
              ? '目前設備總軸數僅 1 軸，無須選用 3 軸一體型 MR-J5W3，請改選「1 軸獨立型」。'
              : '目前設備總軸數為 2 軸，建議改選「2 軸一體型 MR-J5W2」以獲得最佳成本與體積效益。'
            );
            totalAmpUnits += 1;
            opts.bom.push({
              cat: '3 軸一體伺服放大器',
              part: 'MR-J5W3-' + w3Cap + mProto + mN1,
              qty: '1 台',
              desc: '3 軸一體型放大器 (' + pLabel + '，寬僅 75 mm) — 驅動 ' + axes + ' 軸，餘 ' + (3 - axes) + ' 軸空置',
              remark: ''
            });
          } else {
            const w3Qty = Math.floor(axes / 3);
            const rem = axes % 3;
            totalAmpUnits += w3Qty;
            opts.bom.push({
              cat: '3 軸一體伺服放大器',
              part: 'MR-J5W3-' + w3Cap + mProto + mN1,
              qty: w3Qty + ' 台',
              desc: '3 軸一體型放大器 (' + pLabel + '，寬僅 75 mm)，共驅動 ' + (w3Qty * 3) + ' 軸',
              remark: rem === 0 ? '共 ' + axes + ' 軸 ÷ 3 軸/台 = 剛好 ' + w3Qty + ' 台，無閒置空軸' : '驅動其中 ' + (w3Qty * 3) + ' 軸，餘 ' + rem + ' 軸自動以 ' + (rem === 2 ? '1 台 MR-J5W2' : '1 台 1 軸型') + ' 補齊'
            });
            if (rem === 2) {
              totalAmpUnits += 1;
              opts.bom.push({ cat: '補齊餘 2 軸用 2 軸一體放大器', part: 'MR-J5W2-' + w2Cap + mProto + mN1, qty: '1 台', desc: '2 軸一體型放大器 (' + pLabel + ')，精準補足剩餘 2 軸', remark: '' });
            } else if (rem === 1) {
              pushSingle(1, '補齊餘 1 軸用 1 軸伺服放大器', '精準補足剩餘 1 軸，避免浪費空軸');
            }
          }
        }
        return { valid, totalAmpUnits };
      }

      pushSingle(axes, '伺服放大器', '');
      return { valid, totalAmpUnits };
    }

    function computeBom(c) {
      const warnings = [];
      const bom = [];
      let valid = true;
      const axes = Math.max(1, Math.floor(c.axesCount || 1));

      if (c.powerSupply === 'dc-48v') {
        if (c.motorCategory !== 'rotary') { valid = false; warnings.push('DC48V MR-MD333G 僅支援超小型旋轉馬達。'); }
        const amp = c.protocol === 'ethercat' ? 'MR-MD333G-N1' : 'MR-MD333G';
        const mdQty = Math.ceil(axes / 3);
        bom.push({ cat:'基板型 3 軸驅動模組', part: amp, qty: mdQty + ' 組', desc:'DC48V、30W×3軸、耐振 39 m/s² (支援最高 ' + (mdQty*3) + ' 軸)', remark:'' });
        bom.push({ cat:'DC48V 伺服馬達', part: c.holdingBrake ? 'HK-KT0536E2B-S1' : 'HK-KT0536E2-S1', qty: axes + ' 顆', desc:'50W、26-bit 無電池絕對型', remark:'' });
        return { valid, bom, warnings, cycle: '250 μs', kva: '約 0.08 kW (DC48V)', totalAmpUnits: mdQty, selectedMotorModel: 'HK-KT0536E2-S1', selectedMotorKw: 0.05 };
      }

      const ctrl = DATA.controllers.find(x => x.protocol.includes(c.protocol));
      if (ctrl) bom.push({ cat:'建議控制器', part: ctrl.model, qty:'1 套', desc: ctrl.series + ' (' + ctrl.minCycleUs + ')', remark:'' });

      if (c.powerSupply === '1p-100v') {
        if (c.motorCategory !== 'rotary') { valid = false; warnings.push('MR-CM08K1 單相 AC100V 僅支援旋轉伺服馬達。'); }
        if (c.targetPowerKw > 0.75) { valid = false; warnings.push('單相 AC100V MR-CM08K1 單軸上限 0.75 kW，請改選 AC 200V/400V。'); }
      }

      const is400 = c.powerSupply === '3p-400v';
      const isN1 = c.protocol === 'ethercat' || c.protocol === 'ethernet-ip';
      let totalAmpUnits = axes;
      let selectedMotorModel = '';
      let selectedMotorKw = c.targetPowerKw;

      if (c.motorCategory === 'rotary') {
        const voltagePool = DATA.rotaryMotors
          .filter(m => m.voltage !== '48V' && (is400 ? !!m.standardAmp400 : m.voltage === '200V'))
          .sort((a,b) => a.powerKw - b.powerKw);
        let pool = voltagePool;
        if (c.rotaryInertia === 'medium-inertia') pool = voltagePool.filter(m => m.series === 'HK-ST');
        else if (c.rotaryInertia === 'ultra-low') pool = voltagePool.filter(m => m.series === 'HK-MT' || m.series === 'HK-RT');
        else if (c.rotaryInertia === 'large-capacity') pool = voltagePool.filter(m => m.series === 'HK-JT');
        else if (c.rotaryInertia === 'high-speed') pool = voltagePool.filter(m => m.maxSpeedRpm >= 10000);
        else pool = voltagePool.filter(m => m.series === 'HK-KT');

        let m = pool.find(x => x.powerKw >= c.targetPowerKw);
        if (!m) m = voltagePool.find(x => x.powerKw >= c.targetPowerKw) || voltagePool[voltagePool.length - 1];
        selectedMotorModel = m.model;
        selectedMotorKw = m.powerKw;

        const baseCap = fmtCap(m.powerKw);
        const boostStr = is400 ? m.boostAmp400 : m.boostAmp200;
        const singleCap = (c.torqueBoost && boostStr)
          ? boostStr.replace('MR-J5-','').replace('_4','').replace('_','')
          : baseCap;

        const noBrake = m.powerKw >= 22.0;
        if (c.holdingBrake && noBrake) {
          warnings.push('22 kW (HK-JT22K1MJ) 附強制冷卻風扇，原廠無內建電磁煞車規格，垂直負載請另配外部機械煞車。');
        }

        const alloc = allocateAmplifiers({
          criteria: c,
          perAxisKw: m.powerKw,
          singleCap: singleCap,
          descSuffix: (c.torqueBoost && singleCap !== baseCap) ? '・選用大一階增轉矩組合 ◎' : '',
          boostRemark: (!c.torqueBoost && boostStr) ? '可改配 ' + boostStr + ' 提升最大轉矩至 ' + m.boostMaxTorqueNm + ' N·m' : '',
          bom, warnings
        });
        if (!alloc.valid) valid = false;
        totalAmpUnits = alloc.totalAmpUnits;

        const mPart = (c.holdingBrake && !noBrake) ? m.model.replace(/\(B\)/g, 'B') : m.model.replace(/\(B\)/g, '');
        bom.push({
          cat: '旋轉伺服馬達',
          part: mPart,
          qty: axes + ' 顆',
          desc: m.series + ' ' + m.powerKw + ' kW · ' + m.ratedTorqueNm + ' N·m (最大 ' + (c.torqueBoost && m.boostMaxTorqueNm ? m.boostMaxTorqueNm : m.maxTorqueNm) + ' N·m) · 法蘭 □' + m.flangeMm + ' mm',
          remark: m.notes || '標配 26-bit 無電池絕對型編碼器'
        });

        if (c.powerSupply === '1p-100v') {
          const cm08 = Math.max(Math.ceil((m.powerKw * axes) / 0.8), Math.ceil(axes / 3));
          bom.push({ cat:'AC100V 電源變換器', part:'MR-CM08K1', qty: cm08 + ' 台', desc:'限單台 0.8 kW / 最多 3 軸 (僅旋轉馬達)', remark:'' });
        } else if (c.topology === 'common-bus-200v') {
          if (m.powerKw > 2.0) { valid = false; warnings.push('MR-CM3K 簡易共直流母線僅支援 ≤2.0 kW。'); }
          const cm3k = Math.max(Math.ceil((m.powerKw * axes) / 3.0), Math.ceil(totalAmpUnits / 6));
          bom.push({ cat:'200V 共直流母線單元', part:'MR-CM3K', qty: cm3k + ' 台', desc:'單台上限 3 kW，最多並聯 6 台放大器', remark:'' });
        }

        if (m.powerKw >= 11) {
          const dbu = m.powerKw >= 22
            ? (is400 ? 'DBU-22K-4 + GRZG400-_' : 'DBU-22K-R1 + GRZG400-_')
            : m.powerKw >= 15
            ? (is400 ? 'DBU-22K-4 + GRZG400-_' : 'DBU-15K-R1 + GRZG400-_')
            : (is400 ? 'DBU-11K-4 + GRZG400-_' : 'DBU-11K-R1 + GRZG400-_');
          bom.push({ cat:'大容量必選周邊 (12~25kW)', part: dbu, qty: axes + ' 組', desc:'外置動力制動單元 (DBU) 與外置再生電阻', remark:'12~25kW 無內建 DB 與再生電阻' });
        } else if (c.powerSupply === '1p-200v' && m.powerKw > 0.75 && c.topology !== '2-axis') {
          warnings.push('單相 AC200V 驅動 1~2 kW 時實效負載率須 ≤75%，且不對應 SEMI F47。');
        }
      } else if (c.motorCategory === 'linear') {
        const lm = DATA.linearMotors.find(x => x.contThrustN >= c.targetThrustN) || DATA.linearMotors[0];
        selectedMotorModel = lm.series;
        const estKw = lm.contThrustN > 900 ? 3.5 : lm.contThrustN > 400 ? 2.0 : lm.contThrustN > 200 ? 1.0 : 0.4;
        selectedMotorKw = estKw;
        const alloc = allocateAmplifiers({ criteria: c, perAxisKw: estKw, singleCap: fmtCap(estKw), descSuffix: '・線性驅動 ' + estKw + ' kW 等級', boostRemark: '', bom, warnings });
        if (!alloc.valid) valid = false;
        totalAmpUnits = alloc.totalAmpUnits;
        bom.push({ cat:'線性馬達一次側', part: lm.model, qty: axes + ' 組', desc: lm.coreType + ' · 連續 ' + lm.contThrustN + ' N (最大 ' + lm.maxThrustN + ' N)', remark:'' });
        bom.push({ cat:'二次側磁軌', part: lm.secondaryModel, qty: (axes * (lm.series === 'LM-K2' ? 2 : 1)) + ' 排', desc: '建議總長 ≥ ' + (c.strokeMm + lm.primaryLengthMm) + ' mm', remark:'' });
        warnings.push('CN2 嚴禁混用 MR-J4FCCBL03M (全閉環) 與 MR-J4THCBL03M (感溫線)。');
      } else {
        const dd = DATA.directDriveMotors.find(x => x.ratedTorqueNm >= c.targetDdTorqueNm) || DATA.directDriveMotors[DATA.directDriveMotors.length - 1];
        selectedMotorModel = dd.series;
        const ddKw = dd.ratedTorqueNm <= 4.5 ? 0.2 : dd.ratedTorqueNm <= 9 ? 0.4 : dd.ratedTorqueNm <= 48 ? 1.0 : 3.5;
        selectedMotorKw = ddKw;
        const alloc = allocateAmplifiers({ criteria: c, perAxisKw: ddKw, singleCap: fmtCap(ddKw), descSuffix: '・直驅馬達適用', boostRemark: '', bom, warnings });
        if (!alloc.valid) valid = false;
        totalAmpUnits = alloc.totalAmpUnits;
        bom.push({ cat:'直驅馬達 (TM)', part: dd.model, qty: axes + ' 顆', desc: '外徑 φ' + dd.outerDiaMm + 'mm · 中空 φ' + dd.hollowDiaMm + 'mm · 額定 ' + dd.ratedTorqueNm + ' N·m', remark:'' });
        if (c.ddAbsolute) bom.push({ cat:'絕對位置電池', part:'MR-BTAS01 + MR-BAT6V1SET', qty: axes + ' 套', desc:'TM 直驅建構絕對位置必選', remark:'' });
      }

      if (isN1) warnings.push('-N1 (EtherCAT/EIP) 不支援押付運轉與驅動器間通信。');

      const minCycle = c.protocol === 'cc-link-tsn'
        ? (c.topology === '3-axis' || c.safety !== 'sto' || c.feedback !== 'semi-closed' ? '125 μs' : c.topology === '2-axis' ? '62.5 μs' : '31.25 μs')
        : c.protocol === 'ethercat' ? (c.topology === '2-axis' || c.topology === '3-axis' || c.safety !== 'sto' ? '250 μs' : '125 μs')
        : c.protocol === 'ethernet-ip' ? '1~100 ms'
        : c.protocol === 'sscnet' ? '222 μs' : '即時脈衝';
      return {
        valid, bom, warnings, cycle: minCycle,
        kva: c.motorCategory === 'rotary' ? estimateKva(selectedMotorKw) : '依 Motorizer',
        totalAmpUnits, selectedMotorModel, selectedMotorKw
      };
    }

    function buildRotarySvg(spec, withBrake) {

      const bodyW = Math.max(130, Math.min(250, 95 + (activeL / 500) * 165));
      const brakeW = showBrake ? Math.max(24, ((spec.bodyLBrake - spec.bodyL) / activeL) * bodyW) : 0;
      const shaftW = Math.max(46, Math.min(84, 34 + (spec.shaftLenLR / 140) * 52));
      const bodyH = Math.max(82, Math.min(130, 70 + (spec.flangeLC / 250) * 62));

      const cy = 158, flangeX = 320, flangeW = 14;

        '<text x="'+((bodyLeftX+flangeX+flangeW)/2)+'" y="'+(cy+bodyH/2+54)+'" text-anchor="middle" font-size="12" font-family="monospace" font-weight="700" fill="#E60012">L = '+activeL+' mm'+(showBrake?' (含煞車)':'')+'</text>' +

    function buildDdSvg(spec) {

      const inR = Math.max(16, Math.min(54, (spec.hollowDia / spec.outerDiaD) * outR));
      const pcdR = outR * 0.72;
      const holes = [0,45,90,135,180,225,270,315].map(deg => {
        const rad = deg * Math.PI / 180;
        return '<circle cx="'+(cx+Math.cos(rad)*pcdR)+'" cy="'+(cy+Math.sin(rad)*pcdR)+'" r="3.8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.4"/>';
      }).join('');
      return '<svg viewBox="0 0 700 290" class="dim-svg" role="img" aria-label="'+esc(spec.model)+' 外形尺寸圖">' +
        '<rect width="700" height="290" fill="#FFFFFF"/>' +
        '<text x="16" y="22" font-size="11" font-family="monospace" font-weight="700" fill="#64748B">TOP VIEW · 俯視圖 (mm)</text>' +
        '<text x="415" y="22" font-size="11" font-family="monospace" font-weight="700" fill="#64748B">SIDE VIEW · 側面高</text>' +
        '<circle cx="'+cx+'" cy="'+cy+'" r="'+outR+'" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>' +
        '<circle cx="'+cx+'" cy="'+cy+'" r="'+pcdR+'" fill="none" stroke="#94A3B8" stroke-dasharray="4 3"/>' +
        '<circle cx="'+cx+'" cy="'+cy+'" r="'+inR+'" fill="#FFFFFF" stroke="#E60012" stroke-width="2"/>' +
        holes +
        '<text x="'+cx+'" y="50" text-anchor="middle" font-size="12" font-family="monospace" font-weight="700" fill="#0F172A">外徑 φ'+spec.outerDiaD+' mm</text>' +
        '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-family="monospace" font-weight="700" fill="#E60012">φ'+spec.hollowDia+'</text>' +
        '<rect x="445" y="106" width="160" height="86" rx="3" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>' +
        '<rect x="465" y="92" width="120" height="14" rx="2" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.6"/>' +
        '<text x="525" y="224" text-anchor="middle" font-size="12" font-family="monospace" font-weight="700" fill="#E60012">總高 L = '+spec.heightL+' mm</text>' +
        '<text x="525" y="242" text-anchor="middle" font-size="11" font-family="monospace" fill="#475569">轉子螺絲孔 '+esc(spec.rotorTap)+'</text>' +
      '</svg>';
    }

    function renderDimensions() {
      const ctrlEl = document.getElementById('dim-controls');
      const prevEl = document.getElementById('dim-preview');
      const kw = (dimState.keyword || '').trim().toLowerCase();

      let controlsHtml = '<div class="card"><div class="step-tag">SPEC INPUT</div><h2 class="card-title" style="margin-bottom:12px;">輸入馬達規格查詢尺寸圖</h2>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;">' +
          '<button type="button" class="kw-btn '+(dimState.category==='rotary'?'active':'')+'" onclick="dimState.category=\'rotary\';renderDimensions()">旋轉 HK</button>' +
          '<button type="button" class="kw-btn '+(dimState.category==='linear'?'active':'')+'" onclick="dimState.category=\'linear\';renderDimensions()">線性 LM</button>' +
          '<button type="button" class="kw-btn '+(dimState.category==='direct'?'active':'')+'" onclick="dimState.category=\'direct\';renderDimensions()">直驅 TM</button>' +
        '</div>' +
        '<label class="label-sm" style="margin-top:4px;">關鍵字 / 型號搜尋</label>' +
        '<input type="text" style="width:100%;" value="'+esc(dimState.keyword)+'" placeholder="例：HK-KT43、22kW、HK-JT、LM-H4M..." oninput="dimState.keyword=this.value;renderDimensions()" />';

      if (dimState.category === 'rotary') {
        const filtered = DATA.rotaryDimensions.filter(d => {
          const okS = dimState.series === 'ALL' || d.series === dimState.series;
          const okP = dimState.powerKw === 'ALL' || Math.abs(d.powerKw - Number(dimState.powerKw)) < 0.01;
          const okQ = !kw || d.model.toLowerCase().includes(kw) || d.series.toLowerCase().includes(kw) || (d.powerKw+'kw').includes(kw) || String(d.flangeLC).includes(kw);
          return okS && okP && okQ;
        });
        const spec = filtered.find(d => d.id === dimState.selectedRotaryId) || filtered[0] || DATA.rotaryDimensions[0];
        dimState.selectedRotaryId = spec.id;

        const seriesList = ['ALL','HK-KT','HK-MT','HK-ST','HK-RT','HK-JT'];
        const kwList = ['ALL',0.05,0.1,0.15,0.2,0.4,0.5,0.6,0.75,1.0,1.5,2.0,3.5,5.0,7.0,11.0,15.0,22.0];
        controlsHtml +=
          '<label class="label-sm">馬達系列</label><div class="kw-strip">' +
            seriesList.map(s => '<button type="button" class="kw-btn '+(dimState.series===s?'active':'')+'" onclick="dimState.series=\''+s+'\';renderDimensions()">'+(s==='ALL'?'全部':s)+'</button>').join('') +
          '</div>' +
          '<label class="label-sm">額定輸出功率 (kW)</label>' +
          '<select style="width:100%;" onchange="dimState.powerKw=this.value;renderDimensions()">' +
            kwList.map(k => '<option value="'+k+'" '+(String(dimState.powerKw)===String(k)?'selected':'')+'>'+(k==='ALL'?'全部容量 (50W ~ 22kW)':(k<1?(k*1000)+' W ('+k+' kW)':k+' kW'))+'</option>').join('') +
          '</select>' +
          '<label class="label-sm">選擇馬達型號 (共 '+filtered.length+' 筆)</label>' +
          '<select style="width:100%;font-family:var(--mono);" onchange="dimState.selectedRotaryId=this.value;renderDimensions()">' +
            (filtered.length ? filtered : [spec]).map(d => '<option value="'+esc(d.id)+'" '+(d.id===spec.id?'selected':'')+'>'+esc(d.model)+' ('+d.powerKw+'kW / □'+d.flangeLC+')</option>').join('') +
          '</select>' +
          '<div style="margin-top:12px;"><label style="font-size:13px;cursor:pointer;"><input type="checkbox" '+(dimState.withBrake?'checked':'')+' '+(spec.bodyLBrake===null?'disabled':'')+' onchange="dimState.withBrake=this.checked;renderDimensions()" /> 顯示附電磁煞車尺寸 (B)'+(spec.bodyLBrake===null?' — 此機種無煞車':'')+'</label></div>' +
          '</div>';

        const showB = dimState.withBrake && spec.bodyLBrake !== null;
        const activeL = showB ? spec.bodyLBrake : spec.bodyL;
        const activeKL = (showB && spec.connKLBrake !== null) ? spec.connKLBrake : spec.connKL;

        prevEl.innerHTML =
          '<div class="card">' +
            '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:12px;">' +
              '<div><div class="mono" style="font-size:18px;font-weight:700;">'+esc(showB ? spec.model.replace(/\(B\)/g,'B') : spec.model.replace(/\(B\)/g,''))+'</div>' +
              '<div style="font-size:12px;color:#64748B;">'+esc(spec.series)+' · '+spec.powerKw+' kW · '+spec.ratedSpeedRpm+' r/min · '+esc(spec.ipRating)+' · 原廠型錄 p.'+spec.catalogPage+'</div></div>' +
            '</div>' +
            buildRotarySvg(spec, dimState.withBrake) +
            '<div class="metrics-4">' +
              '<div class="metric-box"><div class="k">法蘭尺寸 □LC</div><div class="v">□'+spec.flangeLC+' mm</div></div>' +
              '<div class="metric-box"><div class="k">全長 L '+(showB?'(含煞車)':'(無煞車)')+'</div><div class="v" style="color:#E60012;">'+activeL+' mm</div></div>' +
              '<div class="metric-box"><div class="k">軸徑 φS × 軸長 LR</div><div class="v">φ'+spec.shaftDiaS+' × '+spec.shaftLenLR+'</div></div>' +
              '<div class="metric-box"><div class="k">防護等級</div><div class="v">'+esc(spec.ipRating)+'</div></div>' +
            '</div>' +
            '<div class="table-wrap" style="margin-top:14px;"><table class="dim-table"><thead><tr><th>代號</th><th>項目名稱</th><th>尺寸數值 (mm)</th></tr></thead><tbody>' +
              '<tr><td class="mono"><strong>□LC</strong></td><td>法蘭外徑</td><td class="mono">'+spec.flangeLC+'</td></tr>' +
              '<tr><td class="mono"><strong>L</strong></td><td>馬達本體全長 (無煞車 / 含煞車)</td><td class="mono">'+spec.bodyL+' / '+(spec.bodyLBrake===null?'無煞車規格':spec.bodyLBrake)+'</td></tr>' +
              '<tr><td class="mono"><strong>KL</strong></td><td>法蘭面至接頭中心距</td><td class="mono">'+activeKL+'</td></tr>' +
              '<tr><td class="mono"><strong>LE</strong></td><td>法蘭止口厚度</td><td class="mono">'+spec.flangeThickLE+'</td></tr>' +
              '<tr><td class="mono"><strong>φS</strong></td><td>出力軸徑與公差</td><td class="mono">φ'+spec.shaftDiaS+' ('+esc(spec.shaftTolerance)+')</td></tr>' +
              '<tr><td class="mono"><strong>LR</strong></td><td>出力軸突出長度</td><td class="mono">'+spec.shaftLenLR+'</td></tr>' +
              '<tr><td class="mono"><strong>φLB</strong></td><td>法蘭止口直徑 (h7)</td><td class="mono">φ'+spec.pilotDiaLB+'</td></tr>' +
              '<tr><td class="mono"><strong>φLA</strong></td><td>安裝孔節圓直徑 (PCD)</td><td class="mono">φ'+spec.pcdLA+'</td></tr>' +
              '<tr><td class="mono"><strong>LZ</strong></td><td>法蘭安裝孔規格</td><td class="mono">'+esc(spec.mountHole)+'</td></tr>' +
              '<tr><td class="mono"><strong>Key</strong></td><td>軸端鍵槽</td><td class="mono">'+esc(spec.keywaySpec)+'</td></tr>' +
            '</tbody></table></div>' +
            (spec.notes ? '<div class="remark-box" style="margin-top:10px;">備註：'+esc(spec.notes)+'</div>' : '') +
          '</div>';
      } else if (dimState.category === 'linear') {
        const filtered = DATA.linearDimensions.filter(d => !kw || d.series.toLowerCase().includes(kw) || d.model.toLowerCase().includes(kw) || d.coreType.toLowerCase().includes(kw));
        const spec = filtered.find(d => d.id === dimState.selectedLinearId) || filtered[0] || DATA.linearDimensions[0];
        dimState.selectedLinearId = spec.id;
        controlsHtml +=
          '<label class="label-sm">選擇線性馬達型號</label>' +
          '<select style="width:100%;font-family:var(--mono);" onchange="dimState.selectedLinearId=this.value;renderDimensions()">' +
            (filtered.length ? filtered : [spec]).map(d => '<option value="'+esc(d.id)+'" '+(d.id===spec.id?'selected':'')+'>'+esc(d.series)+' — '+esc(d.model)+'</option>').join('') +
          '</select>' +
          '<label class="label-sm">設計有效行程 (mm)</label>' +
          '<input type="number" min="50" max="10000" step="50" style="width:100%;" value="'+dimState.strokeMm+'" onchange="dimState.strokeMm=Math.max(50,Number(this.value)||500);renderDimensions()" />' +
          '</div>';

        prevEl.innerHTML =
          '<div class="card">' +
            '<div class="mono" style="font-size:18px;font-weight:700;">'+esc(spec.model)+'</div>' +
            '<div style="font-size:12px;color:#64748B;margin-bottom:12px;">'+esc(spec.series)+' · '+esc(spec.coreType)+' · 連續 '+spec.contThrustN+' N / 最大 '+spec.maxThrustN+' N · 原廠型錄 p.'+spec.catalogPage+'</div>' +
            buildLinearSvg(spec, dimState.strokeMm) +
            '<div class="metrics-4">' +
              '<div class="metric-box"><div class="k">動子長度 L</div><div class="v" style="color:#E60012;">'+spec.primaryL+' mm</div></div>' +
              '<div class="metric-box"><div class="k">動子寬度 W</div><div class="v">'+spec.primaryW+' mm</div></div>' +
              '<div class="metric-box"><div class="k">組合總高 H</div><div class="v">'+spec.primaryH+' mm</div></div>' +
              '<div class="metric-box"><div class="k">建議磁軌總長</div><div class="v">≥ '+(dimState.strokeMm+spec.primaryL)+' mm</div></div>' +
            '</div>' +
            '<div class="remark-box" style="margin-top:12px;">固定螺栓 '+esc(spec.mountBolts)+' · 磁軌 '+esc(spec.secondaryModel)+' (單節長 '+spec.secondaryPitchMm+' mm × 寬 '+spec.secondaryW+' mm × 高 '+spec.secondaryH+' mm) · 氣隙 '+spec.airGapMm+' mm · '+esc(spec.notes)+'</div>' +
          '</div>';
      } else {
        const filtered = DATA.directDriveDimensions.filter(d => !kw || d.series.toLowerCase().includes(kw) || d.model.toLowerCase().includes(kw));
        const spec = filtered.find(d => d.id === dimState.selectedDdId) || filtered[0] || DATA.directDriveDimensions[0];
        dimState.selectedDdId = spec.id;
        controlsHtml +=
          '<label class="label-sm">選擇直驅馬達型號</label>' +
          '<select style="width:100%;font-family:var(--mono);" onchange="dimState.selectedDdId=this.value;renderDimensions()">' +
            (filtered.length ? filtered : [spec]).map(d => '<option value="'+esc(d.id)+'" '+(d.id===spec.id?'selected':'')+'>'+esc(d.model)+' ('+d.ratedTorqueNm+' N·m)</option>').join('') +
          '</select></div>';

        prevEl.innerHTML =
          '<div class="card">' +
            '<div class="mono" style="font-size:18px;font-weight:700;">'+esc(spec.model)+'</div>' +
            '<div style="font-size:12px;color:#64748B;margin-bottom:12px;">'+esc(spec.series)+' · '+esc(spec.ipRating)+' · 額定 '+spec.ratedTorqueNm+' N·m / 最大 '+spec.maxTorqueNm+' N·m · 原廠型錄 p.'+spec.catalogPage+'</div>' +
            buildDdSvg(spec) +
            '<div class="metrics-4">' +
              '<div class="metric-box"><div class="k">外徑 φD / 法蘭 □</div><div class="v">φ'+spec.outerDiaD+' / □'+spec.flangeSq+'</div></div>' +
              '<div class="metric-box"><div class="k">中空貫通徑</div><div class="v" style="color:#E60012;">φ'+spec.hollowDia+' mm</div></div>' +
              '<div class="metric-box"><div class="k">馬達總高 L</div><div class="v">'+spec.heightL+' mm</div></div>' +
              '<div class="metric-box"><div class="k">轉子/底座 PCD</div><div class="v">φ'+spec.rotorPcd+' / φ'+spec.basePcd+'</div></div>' +
            '</div>' +
            '<div class="remark-box" style="margin-top:12px;">轉子安裝孔 '+esc(spec.rotorTap)+' · 底座安裝孔 '+esc(spec.mountHoles)+' · '+esc(spec.notes)+'</div>' +
          '</div>';
      }

      ctrlEl.innerHTML = controlsHtml;
    }

    function switchSpec(spec) {
      currentSpec = spec;
      document.querySelectorAll('[data-spec]').forEach(b => b.classList.toggle('active', b.getAttribute('data-spec') === spec));
      renderSpecs();
    }

    function renderSpecs() {
      const q = (document.getElementById('spec-search').value || '').trim().toLowerCase();
      let html = '';
      if (currentSpec === 'amplifiers') {
        const rows = DATA.amplifiers.filter(a => !q || a.series.toLowerCase().includes(q) || a.typeLabel.toLowerCase().includes(q) || a.protocols.toLowerCase().includes(q));
        html = '<div class="table-wrap"><table><thead><tr><th>系列</th><th>電壓/容量</th><th>協定與最小週期</th><th>全閉環與安全</th></tr></thead><tbody>' +
          rows.map(a => '<tr><td><strong class="mono">'+esc(a.series)+'</strong><div style="font-size:12px;color:#64748B;">'+esc(a.typeLabel)+'</div></td><td class="mono">'+esc(a.voltage)+'</td><td>'+esc(a.protocols)+'<div class="mono" style="font-size:12px;color:#64748B;">Min: '+esc(a.minCycle)+'</div></td><td style="font-size:12px;">'+esc(a.fullClosedSupport)+'<br/>'+esc(a.safetyFunctions)+'</td></tr>').join('') +
          '</tbody></table></div>';
      } else if (currentSpec === 'controllers') {
        const rows = DATA.controllers.filter(c => !q || c.model.toLowerCase().includes(q) || c.series.toLowerCase().includes(q));
        html = '<div class="table-wrap"><table><thead><tr><th>型號</th><th>軸數上限</th><th>最小週期</th><th>特性</th></tr></thead><tbody>' +
          rows.map(c => '<tr><td><strong class="mono">'+esc(c.model)+'</strong><div style="font-size:12px;color:#64748B;">'+esc(c.series)+'</div></td><td class="mono">'+esc(c.maxAxes)+'</td><td class="mono">'+esc(c.minCycleUs)+'</td><td style="font-size:12px;">'+esc(c.highlights)+'</td></tr>').join('') +
          '</tbody></table></div>';
      } else if (currentSpec === 'rotary') {
        const rows = DATA.rotaryMotors.filter(m => !q || m.model.toLowerCase().includes(q) || m.series.toLowerCase().includes(q));
        html = '<div class="table-wrap"><table><thead><tr><th>馬達型號</th><th>功率 (kW)</th><th>額定/最大轉矩 (N·m)</th><th>轉速 (r/min)</th><th>搭配放大器</th><th>尺寸圖</th></tr></thead><tbody>' +
          rows.map(m => '<tr><td class="mono"><strong>'+esc(m.model)+'</strong><div style="font-size:11px;color:#64748B;">'+esc(m.voltage+' · '+m.inertiaLabel)+'</div></td><td class="mono">'+m.powerKw+'</td><td class="mono">'+m.ratedTorqueNm+' / '+m.maxTorqueNm+'</td><td class="mono">'+m.ratedSpeedRpm+' / '+m.maxSpeedRpm+'</td><td class="mono" style="font-size:12px;">'+esc(m.standardAmp200 || m.standardAmp400)+'</td><td><button type="button" class="btn-sm" onclick="openDimensionFor(\'rotary\',\''+esc(m.model)+'\','+m.powerKw+',false,500)">尺寸圖</button></td></tr>').join('') +
          '</tbody></table></div>';
      } else {
        const rows = DATA.linearMotors.filter(l => !q || l.series.toLowerCase().includes(q) || l.coreType.toLowerCase().includes(q));
        const dds = DATA.directDriveMotors.filter(d => !q || d.series.toLowerCase().includes(q) || d.model.toLowerCase().includes(q));
        html = '<div class="table-wrap" style="margin-bottom:16px;"><table><thead><tr><th>線性系列</th><th>結構</th><th>代表推力 (連續/最大)</th><th>最高速度</th><th>尺寸圖</th></tr></thead><tbody>' +
          rows.map(l => '<tr><td class="mono"><strong>'+esc(l.series)+'</strong><div style="font-size:11px;color:#64748B;">'+esc(l.model)+'</div></td><td>'+esc(l.coreType)+'</td><td class="mono">'+l.contThrustN+' / '+l.maxThrustN+' N</td><td class="mono">'+l.maxSpeedMs+' m/s</td><td><button type="button" class="btn-sm" onclick="openDimensionFor(\'linear\',\''+esc(l.series)+'\',0,false,500)">尺寸圖</button></td></tr>').join('') +
          '</tbody></table></div>' +
          '<div class="table-wrap"><table><thead><tr><th>直驅系列</th><th>外徑 / 中空徑 (mm)</th><th>代表轉矩 (額定/最大)</th><th>編碼器</th><th>尺寸圖</th></tr></thead><tbody>' +
          dds.map(d => '<tr><td class="mono"><strong>'+esc(d.series)+'</strong><div style="font-size:11px;color:#64748B;">'+esc(d.model)+'</div></td><td class="mono">φ'+d.outerDiaMm+' / φ'+d.hollowDiaMm+'</td><td class="mono">'+d.ratedTorqueNm+' / '+d.maxTorqueNm+' N·m</td><td class="mono" style="font-size:12px;">'+esc(d.encoderRes)+'</td><td><button type="button" class="btn-sm" onclick="openDimensionFor(\'direct\',\''+esc(d.series)+'\',0,false,500)">尺寸圖</button></td></tr>').join('') +
          '</tbody></table></div>';
      }
      document.getElementById('specs-table-container').innerHTML = html;
    }

    function renderDecoder() {
      document.getElementById('decoder-presets').innerHTML = DATA.decoderPresets.map((p, idx) =>
        '<button type="button" class="kw-btn '+(idx===activePresetIdx && !document.getElementById('decoder-input').value?'active':'')+'" onclick="activePresetIdx='+idx+';document.getElementById(\'decoder-input\').value=\'\';renderDecoder()">'+esc(p.fullCode)+'</button>'
      ).join('');
      const custom = (document.getElementById('decoder-input').value || '').trim().toUpperCase();
      let segments = DATA.decoderPresets[activePresetIdx].segments;
      if (custom) {
        segments = [];
        Object.keys(DATA.glossary).forEach(tok => {
          if (custom.includes(tok)) segments.push({ code: tok, label: DATA.glossary[tok].title, meaning: DATA.glossary[tok].detail });
        });
        if (!segments.length) segments.push({ code: custom, label: '自訂輸入', meaning: '請輸入標準前綴如 MR-J5、W2、G、4、-RJ、-HS、-N1 以檢視說明。' });
      }
      document.getElementById('decoder-result').innerHTML = '<div class="bom-list">' +
        segments.map(s => '<div class="bom-item"><strong class="mono" style="color:#E60012;font-size:15px;">'+esc(s.code)+'</strong> <span style="font-weight:600;margin-left:8px;">'+esc(s.label)+'</span><div style="font-size:13px;color:#475569;margin-top:4px;">'+esc(s.meaning)+'</div></div>').join('') +
        '</div>';
      document.getElementById('decoder-glossary').innerHTML = '<div class="bom-list">' +
        Object.entries(DATA.glossary).map(([k,v]) => '<div class="bom-item"><span class="mono" style="font-weight:700;display:inline-block;min-width:96px;">'+esc(k)+'</span><strong>'+esc(v.title)+'</strong><div style="font-size:12px;color:#475569;margin-top:2px;">'+esc(v.detail)+'</div></div>').join('') +
        '</div>';
    }

    renderWizard();
    renderDimensions();
    renderSpecs();
    renderDecoder();
  </script>
</body>
</html>
